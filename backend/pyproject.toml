[project]
name = "backend"
version = "0.1.0"
description = "Daily Loaf"
readme = "README.md"
authors = [
    { name = "Suhasini Gedam", email = "110848623+suhasinigedam@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.1",
    "fastapi>=0.162.5",
    "jinja2>=3.1.6",
    "mangum>=0.22.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-json-logger>=4.2.0",
    "sqlalchemy>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
